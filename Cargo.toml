[package]
name = "bawkshot"
version = "0.1.1"
edition = "2024"
rust-version = "1.92"
license = "MIT"
description = "Screenshot and markup tool"
publish = false

[dependencies]
arboard = { version = "3.6.1", default-features = false, features = ["image-data"] }
async-channel = "2.5.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
dirs = "7.0.0"
global-hotkey = "0.8.0"
gpui-kit = "=0.7.1"
image = { version = "0.25.10", default-features = false, features = ["ico", "jpeg", "png"] }
log = "0.4.34"
lyon = "1.0.19"
raw-window-handle = "0.6.2"
resvg = "0.46.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tray-icon = { version = "0.25.1", default-features = false }
ureq = { version = "3.4.2", features = ["json"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-registry = "0.6.1"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

# Pinned: the test-support feature of 0.7.2 pulls in gpui-fast crates whose versions do not resolve.
[dev-dependencies]
gpui-kit = { version = "=0.7.1", features = ["test-support"] }

[profile.dev.package]
gpui-pre = { opt-level = 3 }
gpui-component = { opt-level = 3 }
gpui-kit = { opt-level = 3 }
gpui-kit-assets = { opt-level = 3 }
gpui-pre-macros = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
image = { opt-level = 3 }
png = { opt-level = 3 }
resvg = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
tiny-skia = { opt-level = 3 }
ttf-parser = { opt-level = 3 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[build-dependencies]
winresource = "0.1.31"
